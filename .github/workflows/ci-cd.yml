name: CI/CD

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  checks: write
  issues: write
  pull-requests: read
  security-events: write

jobs:
  conventional-commits-warning:
    name: conventional-commits-warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'rerun-ci')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report conventional commit warning
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|deps)(\([A-Za-z0-9_.-]+\))?(!)?: .+/;
            const invalid = [];
            if (!pattern.test(process.env.PR_TITLE)) invalid.push(`PR title: ${process.env.PR_TITLE}`);
            const subjects = execFileSync("git", ["log", "--no-merges", "--format=%s", `${process.env.BASE_SHA}..${process.env.HEAD_SHA}`], { encoding: "utf8" }).split(/\r?\n/).filter(Boolean);
            for (const subject of subjects) if (!pattern.test(subject)) invalid.push(`Commit: ${subject}`);
            const marker = "<!-- conventional-commits-warning -->";
            const valid = invalid.length === 0;
            const summary = valid ? "PR title and commit messages follow Conventional Commits." : `The PR remains mergeable, but these messages do not follow Conventional Commits:\n\n${invalid.map(item => `- ${item}`).join("\n")}`;
            try { await github.rest.checks.create({ owner: context.repo.owner, repo: context.repo.repo, name: "conventional-commits", head_sha: process.env.HEAD_SHA, status: "completed", conclusion: valid ? "success" : "neutral", output: { title: valid ? "Conventional Commits" : "Conventional Commits warning", summary } }); } catch (error) { core.warning(`Could not publish the Conventional Commits check: ${error.message}`); }
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
              const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
              if (invalid.length) { const body = `${marker}\n⚠️ **Conventional Commits:** aviso não bloqueante.\n\n${summary}\n\nO CI funcional continua sendo validado normalmente.`; if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body }); else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body }); }
              else if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: `${marker}\n✅ **Conventional Commits:** aviso resolvido; o título e os commits estão no padrão.` });
            } catch (error) { core.warning(`Could not publish the Conventional Commits comment: ${error.message}`); }

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled' || github.event.label.name == 'rerun-ci'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate scaffold
        run: |
          test -f README.md
          test -f config.yaml
          test -f requirements.txt
          test -f scripts/apply_sql.py
          test -f sql/versionamento.sql

  sql:
    name: sql
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration naming
        run: |
          find sql -type f -name '*.sql' | sort | grep -q .
          if grep -E '^[[:space:]]*-[[:space:]]+file:' config.yaml | grep -Ev '^[[:space:]]*-[[:space:]]+file:[[:space:]]+[A-Za-z0-9_./-]+\.sql[[:space:]]*$' | grep -q .; then
            echo "Invalid SQL file in execution_order"
            exit 1
          fi

      - name: Block destructive SQL
        run: |
          if grep -RInEi '\b(TRUNCATE|DROP[[:space:]]+(DATABASE|TABLE|SCHEMA))\b' sql; then
            echo "Destructive SQL is forbidden"
            exit 1
          fi

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SonarCloud
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "sonar.organization=${SONAR_ORGANIZATION:-$owner}"
            echo "sonar.projectKey=${SONAR_PROJECT_KEY:-${owner}_${repo}}"
            echo "sonar.sources=."
            echo "sonar.exclusions=.git/**,.github/**,.venv/**,venv/**,__pycache__/**,dist/**,build/**"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              echo "sonar.branch.name=main"
            fi
          } > sonar-project.properties

      - name: Ensure SonarCloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key="$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)"
          organization="$(grep '^sonar.organization=' sonar-project.properties | cut -d= -f2-)"
          status="$(curl -sS -o /tmp/sonar-create.json -w '%{http_code}' \
            -u "${SONAR_TOKEN}:" \
            -X POST "https://sonarcloud.io/api/projects/create" \
            -d "organization=${organization}" \
            -d "project=${project_key}" \
            -d "name=${GITHUB_REPOSITORY#*/}")"
          if [ "$status" != "200" ] && [ "$status" != "400" ]; then
            cat /tmp/sonar-create.json
            exit 1
          fi

      - name: Disable Automatic Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          project_key="$(grep '^sonar.projectKey=' sonar-project.properties | cut -d= -f2-)"
          curl -fsS -u "${SONAR_TOKEN}:" \
            -X POST "https://sonarcloud.io/api/projects/update_default_analysis_configuration" \
            -d "project=${project_key}" \
            -d "autoScan=false"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: python,actions

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
