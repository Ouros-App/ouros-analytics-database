name: Apply SQL On Main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: apply-sql-main
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Connect to homelab through Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci
          args: --accept-routes=true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check PostgreSQL connectivity
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          python - <<'PY'
          import os
          import socket

          host = os.environ["POSTGRES_HOST"]
          port = int(os.environ.get("POSTGRES_PORT", "5432"))

          with socket.create_connection((host, port), timeout=10):
              print(f"PostgreSQL reachable on {host}:{port}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply SQL
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_ROOT_DB: ${{ secrets.POSTGRES_ROOT_DB }}
          POSTGRES_ROOT_USER: ${{ secrets.POSTGRES_ROOT_USER }}
          POSTGRES_ROOT_PASSWORD: ${{ secrets.POSTGRES_ROOT_PASSWORD }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/apply_sql.py
