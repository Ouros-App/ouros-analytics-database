name: Apply SQL And Deploy Homelab

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: analytics-homelab-main
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Connect to homelab through Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check PostgreSQL connectivity
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        run: |
          python - <<'PY'
          import os
          import socket
          import time

          host = os.environ["POSTGRES_HOST"]
          port = int(os.environ.get("POSTGRES_PORT") or "5432")
          attempts = 5

          for attempt in range(1, attempts + 1):
              try:
                  with socket.create_connection((host, port), timeout=10):
                      print(f"PostgreSQL reachable on {host}:{port}")
                      break
              except OSError as exc:
                  if attempt == attempts:
                      raise SystemExit(
                          f"PostgreSQL unreachable on {host}:{port} "
                          f"after {attempts} attempts: {exc}"
                      ) from exc
                  delay = attempt * 2
                  print(
                      f"Attempt {attempt}/{attempts} failed: {exc}. "
                      f"Retrying in {delay}s..."
                  )
                  time.sleep(delay)
          PY

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply SQL
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_ROOT_DB: ${{ secrets.POSTGRES_ROOT_DB }}
          POSTGRES_ROOT_USER: ${{ secrets.POSTGRES_ROOT_USER }}
          POSTGRES_ROOT_PASSWORD: ${{ secrets.POSTGRES_ROOT_PASSWORD }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: python scripts/apply_sql.py

      - name: Configure SSH
        env:
          HOMELAB_SSH_HOST: ${{ secrets.POSTGRES_HOST }}
          HOMELAB_SSH_PRIVATE_KEY: ${{ secrets.HOMELAB_SSH_PRIVATE_KEY }}
          HOMELAB_SSH_KNOWN_HOSTS: ${{ secrets.HOMELAB_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$HOMELAB_SSH_HOST"
          test -n "$HOMELAB_SSH_PRIVATE_KEY"
          test -n "$HOMELAB_SSH_KNOWN_HOSTS"

          install -d -m 700 ~/.ssh
          printf '%s\n' "$HOMELAB_SSH_PRIVATE_KEY" > ~/.ssh/ouros-analytics-deploy
          chmod 600 ~/.ssh/ouros-analytics-deploy

          printf '%s\n' "$HOMELAB_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          if ! ssh-keygen -F "$HOMELAB_SSH_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "known_hosts nao contem a host key verificada de $HOMELAB_SSH_HOST." >&2
            exit 1
          fi

      - name: Deploy exact push to homelab
        env:
          HOMELAB_SSH_HOST: ${{ secrets.POSTGRES_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/ouros-analytics-deploy \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "vlad-admin@$HOMELAB_SSH_HOST" \
            "bash -s -- '$DEPLOY_SHA'" < scripts/deploy_homelab.sh
